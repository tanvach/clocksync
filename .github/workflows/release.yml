# Builds the firmware for every board. Pull requests only test and build
# (the images are attached to the run); pushes to master publish the browser
# installer to GitHub Pages; v* tags attach the images to a GitHub release.
# (The default github-pages environment only accepts deploys from the
# default branch, so tags don't deploy.)
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ESP32_CORE: "3.3.5"
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach images to the release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Host tests
        run: make -C test

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      - name: Build firmware and installer site
        run: tools/build_installer.sh _site

      - name: Keep the firmware images with the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: _site/downloads/*.bin

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: _site

      - name: Attach images to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: _site/downloads/*.bin

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
